<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- P0-8 CSP：禁外连/eval；MapLibre 需 blob worker + data/blob 图。
       2026-09-27（⑦ 支持远端）：**connect-src 不再写死于此** —— 静态 meta 无法知道运行期后端地址
       （`SONGZUO_BACKEND` / `backend_config.json` 可指向云端），原先只放行回环，导致远端请求被 CSP
       拦成网络错误。现由主进程按**已解析的后端 origin** 注入完整 CSP（见 `src/main/index.ts::installCspForBackend`），
       http/https 远端均可，且比"放行 https: 全部"更紧。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>宋祚</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
