[pytest]
testpaths = ../_dev_tools/game-dev/tests
python_files = test_*.py
addopts = -q
# 分层标记（2026-09-27 实测驱动）：全量墙钟 56.9s，仅收集 1.4s，最慢 25 例合计约 40s
# -> 大头在少数长时推演用例，故对其打 slow；静态守卫/哨兵不标（快路径必须始终跑）。
# 快路径：python -m pytest -m "not slow"   （实测 26.6s，约省 30s）
markers =
    slow: 长时推演类（24-240 个月轨迹等），可用 -m "not slow" 略过
