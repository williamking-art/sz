worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 不记录 Authorization / 请求体，避免 token 落进日志
    log_format mcp '$remote_addr - [$time_local] "$request" $status '
                   '$body_bytes_sent rt=$request_time ua="$http_user_agent"';
    access_log /var/log/nginx/access.log mcp;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # 防 token 暴力猜测（256-bit token 本就不可枚举，这里只挡扫描器）
    limit_req_zone $binary_remote_addr zone=mcp_rl:10m rate=50r/s;
    limit_req_status 429;

    upstream mcp_backend {
        server mcp:9000;
        keepalive 16;
    }

    server {
        # 同时监听 443 与 8443：安全组放行哪个就走哪个，无需改配置。
        # 8443 是当前默认（见部署说明：ICP 备案未办，避开 80/443 常规 Web 面）。
        listen 443 ssl;
        listen 8443 ssl;
        server_name mcp.songzuo.online;

        ssl_certificate     /etc/nginx/certs/mcp.crt;
        ssl_certificate_key /etc/nginx/certs/mcp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # context_save 可能携带较大 payload
        client_max_body_size 16m;

        # 健康检查：不鉴权、不限流、不写访问日志
        location = /healthz {
            proxy_pass http://mcp_backend/healthz;
            access_log off;
        }

        location / {
            limit_req zone=mcp_rl burst=100 nodelay;

            proxy_pass         http://mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # MCP Streamable HTTP 可能是长连接 / 流式响应
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_buffering     off;
            proxy_request_buffering off;
        }
    }

    server {
        # 直连 IP 的明文 HTTP 入口（2026-10-12 起：songzuo.online 未备案，
        # 被阿里云按 SNI 精确拦截——IP/伪造 SNI 均 200，真域名 reset）。
        # 按 IP 直连即不受影响；安全边界仍是逐 agent Bearer token。
        # ⚠️ 明文传输：token 可被链路嗅探。备案通过后应回到上方 TLS 入口并关闭此块。
        # 端口用 18080：8080 已被同机的 songzuo-site 官网容器占用。
        listen 18080;
        server_name _;

        client_max_body_size 16m;

        location = /healthz {
            proxy_pass http://mcp_backend/healthz;
            access_log off;
        }

        location / {
            limit_req zone=mcp_rl burst=100 nodelay;

            proxy_pass         http://mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_buffering     off;
            proxy_request_buffering off;
        }
    }
}
