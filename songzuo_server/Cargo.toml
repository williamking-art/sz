[package]
name = "songzuo_server"
version = "0.1.0"
edition = "2021"

# 后端服务：持有游戏逻辑（GameState + 命令），通过 HTTP 暴露给前端客户端。
# 前端为 game/frontend（Electron + React；Tk 界面已废弃删除），
# 逻辑与结算全部在后端（本进程 / 部署到服务器）。
# 说明：本 crate 为简化版 MVP，数值口径与 Python 本体（game/）不必一致，
# 存档字段亦不互通；完整实现见 game/backend/server.py。

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# 将来接 LLM 用（暂未启用）
reqwest = { version = "0.12", features = ["json"], optional = true }

[features]
default = []
llm = ["reqwest"]

[profile.release]
opt-level = 2
